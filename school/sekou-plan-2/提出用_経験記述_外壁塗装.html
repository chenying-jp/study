<head>

  <style>
    :root { --bg:#f8fafc; --card:#fff; --accent:#b45309; --border:#e2e8f0; --muted:#64748b; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic UI",sans-serif; background:var(--bg); color:#1e293b; padding:14px 12px 48px; line-height:1.7; font-size:15px; }
    .wrap { max-width:720px; margin:0 auto; }
    .banner { background:#fef3c7; border:1px solid #fcd34d; border-radius:10px; padding:12px 14px; margin-bottom:16px; font-size:0.88rem; }
    h1 { font-size:1.1rem; color:var(--accent); margin-bottom:4px; }
    .sub { font-size:0.82rem; color:var(--muted); margin-bottom:16px; }
    .block { background:var(--card); border:1px solid var(--border); border-radius:10px; padding:12px 14px; margin-bottom:12px; }
    .block h2 { font-size:0.85rem; color:var(--accent); margin-bottom:8px; }

      width:100%; border:1px dashed #cbd5e1; border-radius:8px; padding:10px 12px;
      font-size:0.92rem; line-height:1.75; background:#f1f5f9; resize:none; font-family:inherit;
    }

    .full { border:2px solid #fbbf24; background:#fffbeb; }
    a { color:var(--accent); }
  </style>

<body>
<div class="wrap">
  <h1>提出用 · 経験記述（コピペ）</h1>
  <p class="sub">施工管理計画２ · 2026-08-31 未成功 → 明日再提出</p>
  <div class="banner">各欄を長押し（または全選択）してコピー → 学校フォームに貼り付け。假名付き复习は <a href="経験記述_外壁塗装_高温吊りボケット.html">こちら</a>。</div>

  <div class="block">
    <h2>作文テーマ</h2>
    <p class="theme">40階超の高層マンション外壁塗装（35℃・吊りボケット施工）</p>
  </div>

  <div class="block"><h2>① 状況・条件</h2>
    <textarea class="copy" rows="4" readonly onclick="this.select()">7月下旬、最高気温35℃の猛暑日に、40階を超える高層マンションの外壁塗装工事が始まった。足場が組めない高所のため吊りボケット（ゴンドラ）を使い、下請業者4名が15階以上の南面を塗装する5日間の工程だった。</textarea></div>

  <div class="block"><h2>② 問題・おそれ</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">35℃以上では、高所のボケット内は地上よりさらに暑く、熱中症の恐れがある。また、ボケット・ワイヤー・安全装置に不具合があると、墜落・接触事故につながるおそれがあった。</textarea></div>

  <div class="block"><h2>③ 課題</h2>
    <textarea class="copy" rows="2" readonly onclick="this.select()">高所・高温という条件下で、吊りボケットを使った外壁塗装を、安全かつ品質を保って進めなければならない状況だった。</textarea></div>

  <div class="block"><h2>③ 解決するべき事</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">吊りボケットの安全性を第三者機関で確認したうえで、作業員の防暑・水分補給を徹底しながら、予定工期5日以内に塗装を完了させることだった。</textarea></div>

  <div class="block"><h2>④ 検討したこと</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">ボケットは使用前に第三者機関による点検・確認（三方確認）が必要と分かった。気象予報では35℃超が続くため、10時までに作業、以降は休憩とし、こまめな水分補給と熱中症対策用の防暑薬の準備も検討した。</textarea></div>

  <div class="block"><h2>⑤ 実際に行ったこと</h2>
    <textarea class="copy" rows="4" readonly onclick="this.select()">三方確認の結果に問題がないことを確認してから作業開始した。開始時刻を6時に前倒しし、ボケット内に日よけを設け、2時間ごとに休憩と给水を徹底した。熱中症対策用の防暑薬を現場に備え、体調不良の兆候があれば直ちに作業を止めるよう指示した。</textarea></div>

  <div class="block"><h2>⑥ 結果</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">ボケットは安全に使用でき、熱中症者も出なかった。塗料の乾燥ムラもなく、予定どおり5日で15階以上の塗装を完了できた。高所・高温では、三方確認と防暑対策が工程管理とセットで必要だと学んだ。</textarea></div>

  <div class="block full"><h2>提出用（①～⑥つなぎ · 約400字）</h2>
    <textarea class="copy" rows="10" readonly onclick="this.select()">7月下旬、最高気温35℃の猛暑日に、40階超の高層マンションで外壁塗装が始まった。足場が組めない高所のため吊りボケットを使い、下請4名が15階以上の南面を5日間で塗装する工程だった。35℃以上ではボケット内はさらに暑く熱中症が心配で、装置不良は墜落事故にもつながる。高所・高温の条件下で、安全かつ品質を保って塗装を進めなければならなかった。吊りボケットの安全性を第三者機関で確認したうえで、防暑・水分補給を徹底しながら5日以内に完工させる必要があった。ボケットは三方確認が必要と分かり、35℃超の日は10時まで作業・以降休憩とし、水分補給と熱中症対策用の防暑薬の準備を検討した。三方確認後に6時開始、日よけ・2時間ごとの休憩と给水を徹底し、防暑薬を備え体調不良時は直ちに停止するよう指示した。その結果、熱中症者は出ず、ムラもなく5日で完工でき、高所・高温では三方確認と防暑対策が工程管理とセットで重要だと学んだ。</textarea></div>
</div>
