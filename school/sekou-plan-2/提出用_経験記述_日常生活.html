  <style>

<div class="wrap">
  <h1>提出用 · 経験記述（日常生活）</h1>
  <p class="sub">施工管理計画２ · 先生指示どおり日常生活 · テーマ：久しぶりのバドミントン</p>
  <div class="banner">実務ではなく<strong>日常生活</strong>。各欄をタップ→全選択→コピー→貼り付け。<a href="経験記述_バドミントン_日常生活.html">假名付き版</a></div>

  <div class="block"><h2>作文テーマ</h2><p class="theme">久しぶりのバドミントン</p></div>

  <div class="block"><h2>① 状況・条件</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">8月下旬、友達に誘われて、10年以上ぶりにバドミントンをした。普段は学校とアルバイトで忙しく、運動不足だったが、週末の2時間だけなら大丈夫だと思い、体育館に向かった。</textarea></div>

  <div class="block"><h2>② 問題・おそれ</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">10年以上ラケットを握っていなかったので、足や腰の筋肉が思ったより使われる。無理をすると、翌日以降も痛みが続き、学校やアルバイトに支障が出るおそれがあった。</textarea></div>

  <div class="block"><h2>③ 課題</h2>
    <textarea class="copy" rows="2" readonly onclick="this.select()">久しぶりの運動でも、ケガや筋肉痛を防ぎながら、楽しく最後までプレーすることだった。</textarea></div>

  <div class="block"><h2>③ 解決するべき事</h2>
    <textarea class="copy" rows="2" readonly onclick="this.select()">体の負担を抑えつつ、無理のない範囲で動き、翌日も普通に生活できるようにすることだった。</textarea></div>

  <div class="block"><h2>④ 検討したこと</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">インターネットで「久しぶりの運動 注意点」を調べ、十分なストレッチとこまめな水分補給が大切だと分かった。また、最初の30分は軽めに打ち、慣れてから本気で動く方が安全だと考えた。</textarea></div>

  <div class="block"><h2>⑤ 実際に行ったこと</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">プレー前に10分ストレッチをした。プレー中は2ゲームごとに休憩し、水を飲んだ。無理に飛び跳ねず、届く範囲で打つよう心がけた。終わったあとも軽く足を伸ばした。</textarea></div>

  <div class="block"><h2>⑥ 結果</h2>
    <textarea class="copy" rows="3" readonly onclick="this.select()">その日は楽しくプレーでき、翌日は全身筋肉痛だったが、学校には行けた。久しぶりの運動では、最初から全力を出さず、準備と休憩を工夫することが大切だと学んだ。</textarea></div>

  <div class="block full"><h2>提出用（①～⑥つなぎ · 約400字）</h2>
    <textarea class="copy" rows="10" readonly onclick="this.select()">8月下旬、友達に誘われて10年以上ぶりにバドミントンをした。普段は学校とアルバイトで忙しく運動不足だったが、週末2時間なら大丈夫だと思い体育館に向かった。10年以上ラケットを握っていなかったので足や腰が思ったより使われ、無理をすると翌日以降も痛みが続き、学校やアルバイトに支障が出るおそれがあった。久しぶりの運動でもケガや筋肉痛を防ぎながら楽しく最後までプレーし、翌日も普通に生活できる必要があった。インターネットで久しぶりの運動の注意点を調べ、十分なストレッチと水分補給、最初の30分は軽めに打つことが安全だと分かった。プレー前に10分ストレッチし、2ゲームごとに休憩して水を飲み、無理に飛び跳ねず届く範囲で打った。終わったあとも軽く足を伸ばした。その結果、楽しくプレーでき、翌日は全身筋肉痛だったが学校には行けた。久しぶりのことでは、最初から全力を出さず準備と休憩を工夫することが大切だと学んだ。</textarea></div>
</div>
