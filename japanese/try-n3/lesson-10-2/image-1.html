<!DOCTYPE html>

<!-- lesson-10-2 image-1 · rubyize 后再出图 -->
<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>TryN3 第10課（2）— 文法速记</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;family=Noto+Sans+SC:wght@900&amp;display=block" rel="stylesheet"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1440px; overflow: hidden; font-family: "Noto Sans JP", "Noto Sans SC", "Hiragino Sans", "Yu Gothic", sans-serif; background: #FDFDF4; color: #000; }
    .canvas { width: 1080px; height: 1440px; display: flex; flex-direction: column; background: #FDFDF4; }
    .top-spacer { height: 188px; flex-shrink: 0; background: #F3D2C2; }
    .top-line-gap { height: calc(30px * 1.7); flex-shrink: 0; background: #FDFDF4; }
    .page-inset { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 64px; }
    .title-head { font-size: 72px; font-weight: 900; line-height: 1.1; padding: 24px 8px 24px 0; min-height: 136px; text-indent: 1em; flex-shrink: 0; }
    .lesson-title { background: color-mix(in srgb, #FFEB3B 50%, #FFF 50%); font-size: 72px; display: flex; align-items: center; min-height: 176px; }
    .title-wrap { flex-shrink: 0; background: #F3D2C2; }
    .rule-top, .rule-bottom { border: none; border-top: 4px solid #000; margin: 0; }
    .title-box { background: #F3D2C2; font-size: 100px; font-weight: 900; font-family: "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif; display: flex; align-items: center; min-height: 176px; color: #D56332; }
    .story { flex: 1; min-height: 0; background: #FDFDF4; padding: calc(12px + 1.4em) 8px 28px 0; font-size: 32px; font-weight: 500; line-height: 1.72; overflow: hidden; display: flex; flex-direction: column; }
    .story-para + .story-para { margin-top: 26px; }
    ruby rt { font-size: 0.45em; }
    .hl-yellow { background-color: color-mix(in srgb, #FFEB3B 50%, #FFF 50%); font-weight: 700; padding: 0 2px; box-decoration-break: clone; }
</style>
</head>
<body>
<div class="canvas">
<div class="top-spacer"></div><div class="top-line-gap"></div>
<div class="page-inset">
<hr class="rule-top"/>
<div class="title-head lesson-title">TryN3第10課（2）</div>
<div class="title-wrap"><div class="title-head title-box">文法速记</div><hr class="rule-bottom"/></div>
<div class="story">
<div class="story-para"><div class="story-line"><strong>○○さん</strong>は、<ruby>翌日<rt>よくじつ</rt></ruby>、<ruby>日本<rt>にっぽん</rt></ruby><ruby>語<rt>ご</rt></ruby><ruby>教室<rt>きょうしつ</rt></ruby>で<ruby>先生<rt>せんせい</rt></ruby>と<ruby>面談<rt>めんだん</rt></ruby>した。</div></div>
<div class="story-para"><div class="story-line"><span class="hl-yellow"><ruby>遅刻<rt>ちこく</rt></ruby>のことといったら</span>、いつもギリギリだ。アラームをかけた<span class="hl-yellow">くせに</span>、<ruby>今日<rt>きょう</rt></ruby>も<ruby>聞こえ<rt>きこえ</rt></ruby>なかった。</div></div>
<div class="story-para"><div class="story-line"><ruby>李<rt>り</rt></ruby>さんは<span class="hl-yellow"><ruby>試験<rt>しけん</rt></ruby><ruby>前<rt>まえ</rt></ruby>っぽい</span><ruby>顔<rt>かお</rt></ruby>をしていた。<ruby>自分<rt>じぶん</rt></ruby>も<ruby>同じ<rt>おなじ</rt></ruby>かもしれない。</div></div>
<div class="story-para"><div class="story-line"><ruby>聴解<rt>ちょうかい</rt></ruby>が<ruby>苦手<rt>にがて</rt></ruby>なのは、<ruby>単語<rt>たんご</rt></ruby><ruby>量<rt>りょう</rt></ruby><span class="hl-yellow">のせい</span>だと<ruby>分かっ<rt>わかっ</rt></ruby>ている。</div></div>
<div class="story-para"><div class="story-line"><ruby>李<rt>り</rt></ruby>さんは<span class="hl-yellow"><ruby>真面目<rt>まじめ</rt></ruby>なことだから</span>、<ruby>例文<rt>れいぶん</rt></ruby>を<ruby>一<rt>ひと</rt></ruby>つ<ruby>読ん<rt>よん</rt></ruby>でくれた。</div></div>
<div class="story-para"><div class="story-line"><ruby>帰り道<rt>かえりみち</rt></ruby>、もう<ruby>一<rt>いち</rt></ruby><ruby>度<rt>ど</rt></ruby><ruby>音声<rt>おんせい</rt></ruby>を<ruby>流し<rt>ながし</rt></ruby>た。</div></div>
</div>
</div>
</div>
<script>
(function(){var FONT_MIN=24,FONT_PREF=32,LH=[1.72,1.68,1.64,1.6,1.55,1.5],PG=[26,22,18,14,10,8];
function apply(s,fs,lh,pg){s.style.fontSize=fs+'px';s.style.lineHeight=String(lh);s.querySelectorAll('.story-para + .story-para').forEach(function(p){p.style.marginTop=pg+'px';});}
function fit(){var s=document.querySelector('.story');if(!s)return;for(var fs=FONT_PREF;fs>=FONT_MIN;fs--)for(var i=0;i<LH.length;i++)for(var j=0;j<PG.length;j++){apply(s,fs,LH[i],PG[j]);if(s.scrollHeight<=s.clientHeight+2)return;}}
fit();if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fit);})();
</script>
</body>
</html>
