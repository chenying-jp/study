<!DOCTYPE html>

<!-- lesson-04-1 image-2 · N3 合并版（故事句 + 脑内小剧场）· 4 行 -->
<html lang="ja">
<head>
<meta charset="utf-8"/>
<title>文法拆解 — Lesson 04-1</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700;900&amp;display=swap" rel="stylesheet"/>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { width: 1080px; height: 1440px; overflow: hidden; font-family: "Noto Sans JP", "PingFang SC", "Microsoft YaHei", sans-serif; background: #FDFDF4; color: #000000; }
    .canvas { width: 1080px; height: 1440px; display: flex; flex-direction: column; background: #FDFDF4; }
    .title-bar { background: #F3D2C2; text-align: center; font-size: 40px; font-weight: 700; color: #D56332; padding: 18px 16px 16px; flex-shrink: 0; letter-spacing: 0.02em; }
    .table-wrap { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 0 12px 10px; }
    table.grammar-table { width: 100%; height: 100%; border-collapse: collapse; table-layout: fixed; --thead-h: 60px; --grammar-rows: 4; }
    thead th { background: #5DB1B5; color: #FDFDF4; font-size: 28px; font-weight: 700; padding: 10px 6px; border: 1px solid #B8D8DA; text-align: center; line-height: 1.25; }
    tbody tr { height: calc((100% - var(--thead-h)) / var(--grammar-rows)); }
    tbody td { border: 1px solid #E0C8BE; padding: 8px 10px; vertical-align: middle; overflow: hidden; }
    col.col-no { width: 48px; }
    col.col-grammar { width: 256px; }
    col.col-meaning { width: 136px; }
    col.col-dual { width: auto; }
    .col-no { text-align: center; }
    .num { display: inline-flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 50%; background: #F3D2C2; color: #D56332; font-weight: 700; font-size: 24px; }
    .grammar, .meaning, .story-line, .theater-line {
      white-space: normal;
      word-wrap: break-word;
      overflow-wrap: anywhere;
    }
    .grammar { font-weight: 700; font-size: 32px; line-height: 1.32; text-align: left; }
    .meaning { font-size: 30px; line-height: 1.34; color: #222222; text-align: left; }
    .dual-cell { display: flex; flex-direction: column; justify-content: center; height: 100%; gap: 8px; min-height: 0; }
    .story-line { font-size: 32px; line-height: 1.36; text-align: left; }
    .theater-line { font-size: 30px; line-height: 1.36; text-align: left; color: #444444; font-family: "PingFang SC", "Microsoft YaHei", sans-serif; }
    ruby rt { font-size: 0.42em; font-weight: 500; }
    .hl-yellow, .hl-red {
      background-color: color-mix(in srgb, #FFEB3B 50%, #FFFFFF 50%);
      color: #000000;
      font-weight: 700;
      padding: 0 2px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }
  </style>
</head>
<body>
<div class="canvas">
<div class="title-bar no-ruby">文法拆解（N3）</div>
<div class="table-wrap">
<table class="grammar-table">
<colgroup>
<col class="col-no"/><col class="col-grammar"/><col class="col-meaning"/><col class="col-dual"/>
</colgroup>
<thead>
<tr><th>No</th><th class="no-ruby">文法</th><th class="no-ruby">意思</th><th class="no-ruby">故事句 · 脑内小剧场</th></tr>
</thead>
<tbody>
<tr>
<td class="col-no"><span class="num">1</span></td>
<td class="grammar">～てる</td>
<td class="meaning no-ruby">正在……／口语省略</td>
<td>
<div class="dual-cell">
<div class="story-line"><ruby>例文<rt>れいぶん</rt></ruby>を<ruby>声<rt>こえ</rt></ruby>に<ruby>出し<rt>だし</rt></ruby>ながら<ruby>復習<rt>ふくしゅう</rt></ruby><span class="hl-yellow">してる</span></div>
<div class="theater-line no-ruby">边读例文边<span class="hl-yellow">复习着呢</span></div>
</div>
</td>
</tr>
<tr>
<td class="col-no"><span class="num">2</span></td>
<td class="grammar">～なきゃ</td>
<td class="meaning no-ruby">必须……</td>
<td>
<div class="dual-cell">
<div class="story-line">この<ruby>単元<rt>たんげん</rt></ruby>は、もう<ruby>一<rt>いち</rt></ruby><ruby>回<rt>かい</rt></ruby>しっかり<ruby>確認<rt>かくにん</rt></ruby><span class="hl-yellow">しなきゃ</span></div>
<div class="theater-line no-ruby">这个单元<span class="hl-yellow">得再确认一遍</span></div>
</div>
</td>
</tr>
<tr>
<td class="col-no"><span class="num">3</span></td>
<td class="grammar">～っけ</td>
<td class="meaning no-ruby">……来着？</td>
<td>
<div class="dual-cell">
<div class="story-line"><ruby>何<rt>なん</rt></ruby>ページまでやった<span class="hl-yellow">っけ</span>？</div>
<div class="theater-line no-ruby">作业做到哪页<span class="hl-yellow">来着</span>？</div>
</div>
</td>
</tr>
<tr>
<td class="col-no"><span class="num">4</span></td>
<td class="grammar">～たりして</td>
<td class="meaning no-ruby">可能是……</td>
<td>
<div class="dual-cell">
<div class="story-line"><ruby>口語<rt>こうご</rt></ruby>では「ている」を<ruby>短く<rt>みじかく</rt></ruby><span class="hl-yellow">したりして</span><ruby>使う<rt>つかう</rt></ruby></div>
<div class="theater-line no-ruby">口语里<span class="hl-yellow">可能会</span>把「ている」缩短</div>
</div>
</td>
</tr>
</tbody>
</table>
</div>
</div>
<script>
    function fitGrammarRows() {
      var table = document.querySelector('.grammar-table');
      var tbody = table && table.querySelector('tbody');
      if (!table || !tbody) return;
      var rows = tbody.querySelectorAll('tr').length;
      if (rows < 1) return;
      var thead = table.querySelector('thead');
      table.style.setProperty('--grammar-rows', String(rows));
      table.style.setProperty('--thead-h', ((thead && thead.offsetHeight) || 60) + 'px');
    }

    function rowCellsFit() {
      var rows = document.querySelectorAll('.grammar-table tbody tr');
      for (var i = 0; i < rows.length; i++) {
        var cells = rows[i].querySelectorAll('td');
        for (var j = 0; j < cells.length; j++) {
          var cell = cells[j];
          if (cell.scrollHeight > cell.clientHeight + 2) return false;
        }
      }
      return true;
    }

    function applyGrammarFonts(g, m, s, t, gap) {
      document.querySelectorAll('.grammar').forEach(function (el) { el.style.fontSize = g + 'px'; });
      document.querySelectorAll('.meaning').forEach(function (el) { el.style.fontSize = m + 'px'; });
      document.querySelectorAll('.story-line').forEach(function (el) { el.style.fontSize = s + 'px'; });
      document.querySelectorAll('.theater-line').forEach(function (el) { el.style.fontSize = t + 'px'; });
      document.querySelectorAll('.dual-cell').forEach(function (el) { el.style.gap = gap + 'px'; });
    }

    function fitGrammarFonts() {
      var G_PREF = 32, G_MIN = 24;
      var M_PREF = 30, M_MIN = 22;
      var S_PREF = 32, S_MIN = 24;
      var T_PREF = 30, T_MIN = 22;
      var GAPS = [8, 6, 4, 2];
      fitGrammarRows();
      for (var g = G_PREF; g >= G_MIN; g--) {
        for (var m = Math.min(M_PREF, g - 2); m >= M_MIN; m--) {
          for (var s = Math.min(S_PREF, g); s >= S_MIN; s--) {
            for (var t = Math.min(T_PREF, s - 2); t >= T_MIN; t--) {
              for (var gi = 0; gi < GAPS.length; gi++) {
                applyGrammarFonts(g, m, s, t, GAPS[gi]);
                if (rowCellsFit()) return;
              }
            }
          }
        }
      }
      applyGrammarFonts(G_MIN, M_MIN, S_MIN, T_MIN, 2);
    }

    function fitAll() {
      fitGrammarFonts();
    }
    fitAll();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  </script>
</body>
</html>
