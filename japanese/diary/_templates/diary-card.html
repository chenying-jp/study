<!DOCTYPE html>
<!--
  日语口说 · 日记便签 · 小红书 3:4 模板 v0.2
  ─────────────────────────────────────────────
  替换项：
    {{DATE}}  → 2026年7月9日
    {{BODY}}  → <p>…</p> 段落 HTML（可含 ruby）
  固定项：
    大标题 日语口说 · 79px · 不可改
  画布：1080 × 1440 px · 内容铺满 · 标题距顶 1/5
-->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1080">
  <title>日语口说 · {{DATE}}</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 1080px;
      height: 1440px;
      overflow: hidden;
    }

    body {
      font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ── 全画布便签 · 暖纸底 ── */
    .canvas {
      width: 1080px;
      height: 1440px;
      position: relative;
      display: flex;
      flex-direction: column;
      background-color: #F3EDE4;
      background-image:
        repeating-linear-gradient(
          0deg,
          transparent,
          transparent 55px,
          rgba(180, 165, 145, 0.08) 55px,
          rgba(180, 165, 145, 0.08) 56px
        );
      /* 标题起点 = 距顶 1/5；左右下留边距 */
      padding: 288px 72px 88px 84px;
      overflow: hidden;
    }

    /* 左侧撕口竖线 · 全高 */
    .canvas::before {
      content: "";
      position: absolute;
      left: 0;
      top: 120px;
      bottom: 88px;
      width: 6px;
      background: linear-gradient(180deg, #D4C4AE 0%, #C9B8A0 50%, #D4C4AE 100%);
      border-radius: 0 3px 3px 0;
    }

    /* 右下水印 */
    .canvas::after {
      content: "日";
      position: absolute;
      right: 48px;
      bottom: 36px;
      font-family: "Noto Serif JP", serif;
      font-size: 200px;
      font-weight: 400;
      color: rgba(180, 165, 145, 0.10);
      line-height: 1;
      pointer-events: none;
      user-select: none;
    }

    .content {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── 标题区 ── */
    .header {
      flex-shrink: 0;
      margin-bottom: 48px;
    }

    .main-title {
      font-size: 79px;
      font-weight: 700;
      letter-spacing: 0.22em;
      color: #3D3832;
      margin-bottom: 16px;
      line-height: 1.3;
    }

    .sub-title {
      font-family: "Noto Serif JP", serif;
      font-size: 38px;
      font-weight: 400;
      letter-spacing: 0.10em;
      color: #8A8278;
      line-height: 1.4;
    }

    .divider {
      margin-top: 36px;
      height: 2px;
      background: linear-gradient(90deg, #C9B8A0 0%, rgba(201, 184, 160, 0.15) 85%);
    }

    /* ── 正文 · 铺满剩余区域 ── */
    .body-wrap {
      flex: 1;
      min-height: 0;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
    }

    .body {
      font-size: 48px;
      font-weight: 400;
      line-height: 1.78;
      letter-spacing: 0.03em;
      color: #2A2826;
    }

    .body p {
      margin-bottom: 1.05em;
    }

    .body p:last-child {
      margin-bottom: 0;
    }

    .body ruby {
      ruby-align: center;
    }

    .body ruby rt {
      font-size: 0.40em;
      font-weight: 400;
      letter-spacing: 0;
      color: #7A756E;
    }

    /* 自适应：正文过长时缩小 */
    .body.fit-sm { font-size: 42px; line-height: 1.72; }
    .body.fit-md { font-size: 38px; line-height: 1.68; }
    .body.fit-xs { font-size: 34px; line-height: 1.62; }
  </style>
</head>
<body>
  <div class="canvas">
    <div class="content">
      <header class="header">
        <h1 class="main-title">日语口说</h1>
        <p class="sub-title">{{DATE}}</p>
        <div class="divider"></div>
      </header>
      <div class="body-wrap">
        <div class="body" id="body">{{BODY}}</div>
      </div>
    </div>
  </div>
  <script>
    (function fitBody() {
      const el = document.getElementById("body");
      const wrap = el.parentElement;
      const steps = [
        { cls: "", fs: 48, lh: 1.78 },
        { cls: "fit-sm", fs: 42, lh: 1.72 },
        { cls: "fit-md", fs: 38, lh: 1.68 },
        { cls: "fit-xs", fs: 34, lh: 1.62 },
      ];
      for (const s of steps) {
        el.className = "body" + (s.cls ? " " + s.cls : "");
        el.style.fontSize = s.fs + "px";
        el.style.lineHeight = s.lh;
        if (el.scrollHeight <= wrap.clientHeight) return;
      }
    })();
  </script>
</body>
</html>
