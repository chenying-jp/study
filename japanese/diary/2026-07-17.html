<!DOCTYPE html>

<html lang="ja">
<head>
<meta charset="utf-8"/>
<meta content="width=1080" name="viewport"/>
<title>日语口说 · 2026年7月17日</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&amp;family=Noto+Serif+JP:wght@400;500&amp;display=swap" rel="stylesheet"/>
<style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1440px; overflow: hidden; }
    body { font-family: "Noto Sans JP", "Yu Gothic", "Hiragino Sans", sans-serif; -webkit-font-smoothing: antialiased; }
    .canvas {
      width: 1080px; height: 1440px; position: relative;
      display: flex; flex-direction: column;
      background-color: #F3EDE4;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 55px, rgba(180,165,145,0.08) 55px, rgba(180,165,145,0.08) 56px);
      padding: 288px 72px 88px 84px; overflow: hidden;
    }
    .canvas::before {
      content: ""; position: absolute; left: 0; top: 120px; bottom: 88px; width: 6px;
      background: linear-gradient(180deg, #D4C4AE 0%, #C9B8A0 50%, #D4C4AE 100%);
      border-radius: 0 3px 3px 0;
    }
    .canvas::after {
      content: "日"; position: absolute; right: 48px; bottom: 36px;
      font-family: "Noto Serif JP", serif; font-size: 200px; color: rgba(180,165,145,0.10);
      line-height: 1; pointer-events: none; user-select: none;
    }
    .content { flex: 1; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
    .header { flex-shrink: 0; margin-bottom: 48px; }
    .main-title { font-size: 79px; font-weight: 700; letter-spacing: 0.22em; color: #3D3832; margin-bottom: 16px; line-height: 1.3; }
    .sub-title { font-family: "Noto Serif JP", serif; font-size: 38px; font-weight: 400; letter-spacing: 0.10em; color: #8A8278; line-height: 1.4; }
    .divider { margin-top: 36px; height: 2px; background: linear-gradient(90deg, #C9B8A0 0%, rgba(201,184,160,0.15) 85%); }
    .body-wrap { flex: 1; min-height: 0; overflow: hidden; display: flex; flex-direction: column; justify-content: flex-start; }
    .body { font-size: 48px; font-weight: 400; line-height: 1.78; letter-spacing: 0.03em; color: #2A2826; }
    .body p { margin-bottom: 1.05em; }
    .body p:last-child { margin-bottom: 0; }
    .body ruby { ruby-align: center; }
    .body ruby rt { font-size: 0.40em; font-weight: 400; letter-spacing: 0; color: #7A756E; }
    .body.fit-sm { font-size: 42px; line-height: 1.72; }
    .body.fit-md { font-size: 38px; line-height: 1.68; }
    .body.fit-xs { font-size: 34px; line-height: 1.62; }
  </style>
</head>
<body>
<div class="canvas">
<div class="content">
<header class="header">
<h1 class="main-title">日语口说</h1>
<p class="sub-title">2026年7月17日</p>
<div class="divider"></div>
</header>
<div class="body-wrap">
<div class="body" id="body">
<p><ruby>今日<rt>きょう</rt></ruby>は<ruby>金曜<rt>きんよう</rt></ruby><ruby>日<rt>ひ</rt></ruby>。<ruby>今週<rt>こんしゅう</rt></ruby>も<ruby>早かっ<rt>はやかっ</rt></ruby>たな〜。</p>
<p><ruby>実<rt>じつ</rt></ruby>は、<ruby>今日<rt>きょう</rt></ruby>の<ruby>午前<rt>ごぜん</rt></ruby><ruby>中<rt>ちゅう</rt></ruby>の<ruby>授業<rt>じゅぎょう</rt></ruby>はずっと<ruby>眠く<rt>ねむく</rt></ruby>て、ここ<ruby>最近<rt>さいきん</rt></ruby>もずっと<ruby>同じ<rt>おなじ</rt></ruby><ruby>感じ<rt>かんじ</rt></ruby>なんです。たぶん<ruby>風邪<rt>かぜ</rt></ruby>を<ruby>引い<rt>ひい</rt></ruby>たかもしれません。</p>
<p><ruby>熱<rt>ねつ</rt></ruby>はないんだけど、<ruby>頭<rt>あたま</rt></ruby>が<ruby>痛く<rt>いたく</rt></ruby>て、<ruby>体調<rt>たいちょう</rt></ruby>があまりよくない<ruby>感じ<rt>かんじ</rt></ruby>です。</p>
<p>「<ruby>水分<rt>すいぶん</rt></ruby>をとる」って、<ruby>水<rt>みず</rt></ruby>やお<ruby>茶<rt>ちゃ</rt></ruby>をしっかり<ruby>飲む<rt>のむ</rt></ruby>ことだって<ruby>知り<rt>しり</rt></ruby>ました。<ruby>今夜<rt>こんや</rt></ruby>は<ruby>無理<rt>むり</rt></ruby>しないで、ゆっくり<ruby>休ん<rt>やすん</rt></ruby>で<ruby>様子<rt>ようす</rt></ruby>を<ruby>見<rt>み</rt></ruby>ます。</p>
</div>
</div>
</div>
</div>
<script>
    (function fitBody() {
      const el = document.getElementById("body");
      const wrap = el.parentElement;
      const steps = [
        { cls: "", fs: 48, lh: 1.78 },
        { cls: "fit-sm", fs: 42, lh: 1.72 },
        { cls: "fit-md", fs: 38, lh: 1.68 },
        { cls: "fit-xs", fs: 34, lh: 1.62 },
      ];
      for (const s of steps) {
        el.className = "body" + (s.cls ? " " + s.cls : "");
        el.style.fontSize = s.fs + "px";
        el.style.lineHeight = s.lh;
        if (el.scrollHeight <= wrap.clientHeight) return;
      }
    })();
  </script>
</body>
</html>
