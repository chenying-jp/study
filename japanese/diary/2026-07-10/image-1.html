<!DOCTYPE html>
<!-- 07_日记 image-1 · 标题+日期+插画+一句话 -->
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>日语口说 · 2026年7月10日</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 1080px; height: 1440px; overflow: hidden; }
    body { font-family: "Noto Sans JP", "Yu Gothic", sans-serif; -webkit-font-smoothing: antialiased; }
    .canvas {
      width: 1080px; height: 1440px; position: relative;
      display: flex; flex-direction: column;
      background-color: #F3EDE4;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 55px, rgba(180,165,145,0.08) 55px, rgba(180,165,145,0.08) 56px);
      /* 固定：标题距顶 1/5（与 2026-07-09 一致） */
      padding: 288px 72px 88px 84px; overflow: hidden;
    }
    .canvas::before {
      content: ""; position: absolute; left: 0; top: 120px; bottom: 88px; width: 6px;
      background: linear-gradient(180deg, #D4C4AE 0%, #C9B8A0 50%, #D4C4AE 100%);
      border-radius: 0 3px 3px 0;
    }
    .canvas::after {
      content: "日"; position: absolute; right: 48px; bottom: 36px;
      font-family: "Noto Serif JP", serif; font-size: 200px; color: rgba(180,165,145,0.10);
      line-height: 1; pointer-events: none; user-select: none;
    }
    .header { flex-shrink: 0; margin-bottom: 32px; }
    .main-title { font-size: 79px; font-weight: 700; letter-spacing: 0.22em; color: #3D3832; margin-bottom: 16px; line-height: 1.3; }
    .sub-title { font-family: "Noto Serif JP", serif; font-size: 38px; font-weight: 400; letter-spacing: 0.10em; color: #8A8278; line-height: 1.4; }
    .divider { margin-top: 36px; height: 2px; background: linear-gradient(90deg, #C9B8A0 0%, rgba(201,184,160,0.15) 85%); }
    .illus-wrap {
      flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
      margin: 0 0 20px;
    }
    .illus-frame {
      width: 100%; max-height: 100%; border-radius: 20px; overflow: hidden;
      box-shadow: 0 8px 28px rgba(61,56,50,0.12);
      border: 3px solid rgba(201,184,160,0.55);
      background: #fff;
    }
    .illus-frame img { display: block; width: 100%; height: auto; max-height: 580px; object-fit: cover; object-position: center top; }
    .quote {
      flex-shrink: 0; text-align: center;
      font-size: 46px; font-weight: 500; line-height: 1.55;
      letter-spacing: 0.06em; color: #2A2826;
      padding: 8px 12px 0;
    }
    .quote ruby rt { font-size: 0.42em; color: #7A756E; }
  </style>
</head>
<body>
  <div class="canvas">
    <header class="header">
      <h1 class="main-title">日语口说</h1>
      <p class="sub-title">2026年7月10日</p>
      <div class="divider"></div>
    </header>
    <div class="illus-wrap">
      <div class="illus-frame">
        <img src="illustration.png" alt="発表场景イラスト">
      </div>
    </div>
    <p class="quote"><ruby>発表<rt>はっぴょう</rt></ruby>終わった、<ruby>嬉<rt>うれ</rt></ruby>しかった。</p>
  </div>
</body>
</html>
